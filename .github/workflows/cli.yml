name: CLI checks

on:
  pull_request:
    paths: ['cli/**', 'package.json', 'site/src/lib/**', 'site/scripts/lib/**', '.github/workflows/cli.yml']
  push:
    branches: [main]
    paths: ['cli/**', 'package.json', 'site/src/lib/**', 'site/scripts/lib/**', '.github/workflows/cli.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test without dependency installs
        run: node --test "cli/test/*.test.mjs"
      - name: Check catalog
        run: node cli/bin/loushing.mjs check --json
      - name: Pack without registry access
        env:
          NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
        run: |
          npm config get registry
          npm pack --offline --ignore-scripts --pack-destination .agent-orchestration
